<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Base Assistant — Demo</title>
<style>
  :root { --bg:#0b1220; --panel:#121b2e; --line:#24324d; --text:#e6edf7; --muted:#93a4bf; --accent:#7ee0b8; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 120px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  .msg { padding:12px 14px; border-radius:12px; margin:10px 0; background:var(--panel); border:1px solid var(--line); white-space:pre-wrap; }
  .me { background:#17304a; border-color:#1f4d73; margin-left:15%; }
  .cites { margin-top:8px; font-size:12px; color:var(--muted); } .cites b { color:var(--accent); }
  .meta { font-size:11px; color:var(--muted); margin-top:6px; }
  form { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line); padding:12px; }
  .row { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  input#key { flex:0 0 140px; }
  button { padding:12px 18px; border-radius:10px; border:0; background:var(--accent); color:#06281d; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Northwind Desk — Help Assistant</h1>
  <p class="sub">Demo project. Answers come only from the indexed documents, with citations.</p>
  <div id="log"></div>
</main>
<form id="f">
  <div class="row">
    <input id="key" placeholder="API key" value="change-me" aria-label="API key">
    <input id="q" placeholder="Ask a question, e.g. How long do I have to request a refund?" autocomplete="off" aria-label="Question">
    <button>Ask</button>
  </div>
</form>
<script>
const log = document.getElementById('log');
function add(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); window.scrollTo(0, document.body.scrollHeight); return d; }
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = document.getElementById('q'); const question = q.value.trim(); if (!question) return;
  add('me', question); q.value = '';
  const box = add('', 'Thinking…');
  try {
    const r = await fetch('/v1/ask', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-API-Key': document.getElementById('key').value }, body: JSON.stringify({ question }) });
    const data = await r.json();
    if (!r.ok) { box.textContent = 'Error: ' + (data.detail || r.status); return; }
    box.textContent = data.answer;
    if (data.citations.length) {
      const c = document.createElement('div'); c.className = 'cites';
      data.citations.forEach(x => { const line = document.createElement('div'); const b = document.createElement('b'); b.textContent = '[' + x.number + '] '; line.appendChild(b); line.appendChild(document.createTextNode(x.source + ' › ' + x.section)); c.appendChild(line); });
      box.appendChild(c);
    }
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = `${data.refused ? 'refused (no supporting source)' : 'grounded: ' + data.grounded} · retrieval score ${data.top_score} · ${data.latency_ms} ms · $${data.cost_usd}` + (data.injection_flags ? ` · ${data.injection_flags} injected instruction(s) removed` : '');
    box.appendChild(m);
  } catch (err) { box.textContent = 'Network error: ' + err; }
});
</script>
</body>
</html>
